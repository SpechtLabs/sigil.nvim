name: Pull Request Hygiene

# release-please derives the next version and the changelog from commit
# titles, and squash merges take the pull request's title.

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

jobs:
  pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
