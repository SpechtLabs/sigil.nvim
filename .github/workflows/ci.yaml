name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # mise itself, pinned like the tools it installs.
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.10.7

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
      - run: mise run lint

  queries:
    name: Queries match the pinned grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
      - run: mise run queries-check

  # The legs name a channel, not a version, so their check names stay the same
  # when Renovate moves a version.
  test:
    name: Test (Neovim ${{ matrix.channel }})
    runs-on: ubuntu-latest
    # A nightly regression shows up here but doesn't fail the job, so it never
    # blocks a merge through the CI passed gate.
    continue-on-error: ${{ matrix.channel == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest release the plugin supports. Renovate moves it to the
          # newest patch of that series (see renovate.json); dropping a series
          # is a decision, not an update.
          - channel: oldest
            # renovate: datasource=github-releases depName=neovim/neovim extractVersion=^v(?<version>.+)$
            NEOVIM_VERSION: "0.11.7"
          # The release .mise.toml pins, which Renovate keeps current.
          - channel: stable
            NEOVIM_VERSION: ""
          - channel: nightly
            NEOVIM_VERSION: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
      # Authenticated, so the release lookup isn't rate limited on shared runners.
      - name: Install Neovim ${{ matrix.NEOVIM_VERSION }}
        if: matrix.NEOVIM_VERSION != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise install "neovim@${{ matrix.NEOVIM_VERSION }}"
      # The parser tests run against the grammar at the pinned revision, and
      # the install test builds it with nvim-treesitter main, which needs
      # Neovim 0.12.
      - name: Build the parser
        run: mise run parser
      - name: Test
        env:
          NEOVIM_VERSION: ${{ matrix.NEOVIM_VERSION }}
          SIGIL_TEST_PARSER: ${{ github.workspace }}/.tests/parser/sigil.so
          SIGIL_TEST_INSTALL: ${{ matrix.channel != 'oldest' && '1' || '' }}
        run: |
          mise exec ${NEOVIM_VERSION:+"neovim@$NEOVIM_VERSION"} -- nvim --version | head -1
          mise exec ${NEOVIM_VERSION:+"neovim@$NEOVIM_VERSION"} -- nvim -l tests/run.lua

  # The one check the main branch ruleset requires, with Validate PR title:
  # it passes only when every job it needs succeeded or was skipped, so a new
  # job joins the gate by joining `needs`, without touching the ruleset.
  passed:
    name: CI passed
    if: always()
    needs: [lint, queries, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check every job's result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::Failed or cancelled: $failed"
            exit 1
          fi
