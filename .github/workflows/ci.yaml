name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # mise itself, pinned like the tools it installs.
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.10.2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
      - run: mise run lint

  queries:
    name: Queries match the pinned grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
      - run: mise run queries-check

  test:
    name: Test (Neovim ${{ matrix.neovim }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release, the pinned stable one, and nightly.
        neovim: ["0.11.7", "0.12.5", "nightly"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
      - name: Install Neovim ${{ matrix.neovim }}
        run: mise install "neovim@${{ matrix.neovim }}"
      # The parser tests run against the grammar at the pinned revision, and
      # the install test builds it with nvim-treesitter main, which needs
      # Neovim 0.12.
      - name: Build the parser
        run: mise run parser
      - name: Test
        env:
          SIGIL_TEST_PARSER: ${{ github.workspace }}/.tests/parser/sigil.so
          SIGIL_TEST_INSTALL: ${{ matrix.neovim != '0.11.7' && '1' || '' }}
        run: mise exec "neovim@${{ matrix.neovim }}" -- nvim -l tests/run.lua
